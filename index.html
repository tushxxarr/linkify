<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Transfer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Animations & Scrollbar */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hidden-view { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col selection:bg-blue-500/30">

    <!-- VIEW: REDIRECTING -->
    <div id="view-redirect" class="hidden-view flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-gray-800 p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-700 fade-in">
            <div id="redirect-spinner" class="spinner mx-auto mb-6"></div>
            <h2 class="text-3xl font-extrabold text-white mb-3" id="redirect-title">Locating Link...</h2>
            <p class="text-gray-400 font-medium" id="redirect-msg">Please wait while we transfer you securely.</p>
            
            <!-- Fallback button if auto-redirect fails or user wants to proceed manually -->
            <button id="redirect-btn" class="hidden mt-8 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-blue-500/20">
                Continue to Destination
            </button>
        </div>
    </div>

    <!-- VIEW: ADMIN LOGIN -->
    <div id="view-login" class="hidden-view flex-1 flex items-center justify-center p-6">
        <div class="bg-gray-800 p-8 rounded-3xl shadow-2xl max-w-sm w-full border border-gray-700 fade-in">
            <div class="text-center mb-8">
                <div class="bg-gray-900 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-700 shadow-inner">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-white">Admin Access</h2>
                <p class="text-gray-400 text-sm mt-2">Enter password to manage your redirects.</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <input type="password" id="password-input" placeholder="Enter Password" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-500" required>
                <button type="submit" class="w-full bg-white text-gray-900 hover:bg-gray-200 font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95">
                    Unlock Portal
                </button>
            </form>
        </div>
    </div>

    <!-- VIEW: ADMIN DASHBOARD -->
    <div id="view-dashboard" class="hidden-view flex-1 flex flex-col p-4 md:p-8 max-w-6xl mx-auto w-full fade-in">
        <header class="flex justify-between items-center mb-8 bg-gray-800 p-4 md:p-6 rounded-2xl border border-gray-700 shadow-md">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-white tracking-wide">LinkTransfer <span class="text-blue-500">Pro</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="db-status" class="hidden md:flex items-center gap-2 text-xs font-mono bg-gray-900 px-3 py-1.5 rounded-md border border-gray-700">
                    <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> Local Mode
                </div>
                <button id="btn-logout" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">Lock</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Create Link Panel -->
            <div class="lg:col-span-1">
                <div class="bg-gray-800 rounded-3xl p-6 border border-gray-700 shadow-xl sticky top-6">
                    <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Create New Link
                    </h3>
                    <form id="create-link-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Destination URL</label>
                            <input type="url" id="target-url" placeholder="https://..." class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-all" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Link Validity</label>
                            <select id="expiration-select" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-all appearance-none cursor-pointer">
                                <option value="lifetime">Lifetime (Until I close it)</option>
                                <option value="1m">1 Minute (For testing)</option>
                                <option value="1h">1 Hour</option>
                                <option value="24h">24 Hours</option>
                                <option value="7d">7 Days</option>
                            </select>
                        </div>
                        <button type="submit" id="btn-generate" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-500/20 mt-4 active:scale-95">
                            Generate Short Link
                        </button>
                    </form>
                </div>
            </div>

            <!-- Links List Panel -->
            <div class="lg:col-span-2">
                <div class="bg-gray-800 rounded-3xl p-6 border border-gray-700 shadow-xl min-h-[500px] flex flex-col">
                    <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                        <h3 class="text-lg font-bold text-white">Active Transfers</h3>
                        <span id="link-count" class="bg-gray-900 text-blue-400 text-xs font-bold px-3 py-1.5 rounded-full border border-gray-700">0 Links</span>
                    </div>
                    
                    <div id="links-container" class="space-y-4 overflow-y-auto flex-1 pr-2">
                        <!-- Links will render here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-700 text-white px-6 py-3 rounded-full shadow-2xl transition-all translate-y-20 opacity-0 duration-300 pointer-events-none z-50 flex items-center gap-3 font-medium">
        <svg id="toast-icon" class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        // ==========================================
        // ⚙️ CONFIGURATION & VERCEL NATIVE SETUP
        // ==========================================
        
        const ADMIN_PASSWORD = "admin"; 

        /* 
         * 🚀 VERCEL KV (REDIS) INTEGRATION
         * To make this work globally without Firebase, Vercel provides a free KV database.
         * 1. Go to your Vercel Dashboard -> Storage -> Create KV Database.
         * 2. Connect it to this project.
         * 3. Go to the `.env.local` tab in Vercel Storage and copy the REST API details here:
         */
        const VERCEL_KV_REST_API_URL = ""; // e.g., "https://fitting-urchin-32145.upstash.io"
        const VERCEL_KV_REST_API_TOKEN = ""; // e.g., "AYhHAFGHK..."
        
        // Auto-detect if user has configured Vercel KV
        const isVercelMode = VERCEL_KV_REST_API_URL !== "" && VERCEL_KV_REST_API_TOKEN !== "";

        // ==========================================
        // 💾 DATABASE DRIVER (Abstracts KV vs LocalStorage)
        // ==========================================
        const DB = {
            async save(key, data) {
                if (isVercelMode) {
                    await fetch(`${VERCEL_KV_REST_API_URL}/set/${key}`, {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${VERCEL_KV_REST_API_TOKEN}` },
                        body: JSON.stringify(data)
                    });
                } else {
                    const links = JSON.parse(localStorage.getItem('my_links') || '{}');
                    links[key] = data;
                    localStorage.setItem('my_links', JSON.stringify(links));
                }
            },
            async get(key) {
                if (isVercelMode) {
                    const res = await fetch(`${VERCEL_KV_REST_API_URL}/get/${key}`, {
                        headers: { Authorization: `Bearer ${VERCEL_KV_REST_API_TOKEN}` }
                    });
                    const json = await res.json();
                    return json.result ? JSON.parse(json.result) : null;
                } else {
                    const links = JSON.parse(localStorage.getItem('my_links') || '{}');
                    return links[key] || null;
                }
            },
            async delete(key) {
                if (isVercelMode) {
                    await fetch(`${VERCEL_KV_REST_API_URL}/del/${key}`, {
                        headers: { Authorization: `Bearer ${VERCEL_KV_REST_API_TOKEN}` }
                    });
                } else {
                    const links = JSON.parse(localStorage.getItem('my_links') || '{}');
                    delete links[key];
                    localStorage.setItem('my_links', JSON.stringify(links));
                }
            },
            async getAll() {
                if (isVercelMode) {
                    // Fetch all keys matching our prefix
                    const res = await fetch(`${VERCEL_KV_REST_API_URL}/scan/0?match=link_*&count=100`, {
                        headers: { Authorization: `Bearer ${VERCEL_KV_REST_API_TOKEN}` }
                    });
                    const scanData = await res.json();
                    const keys = scanData.result[1] || [];
                    
                    // Fetch data for each key
                    const links = {};
                    for (const key of keys) {
                        const data = await this.get(key);
                        if (data) links[key] = data;
                    }
                    return links;
                } else {
                    return JSON.parse(localStorage.getItem('my_links') || '{}');
                }
            }
        };

        // ==========================================
        // 🧠 APPLICATION LOGIC
        // ==========================================
        const views = {
            redirect: document.getElementById('view-redirect'),
            login: document.getElementById('view-login'),
            dashboard: document.getElementById('view-dashboard')
        };

        function showView(viewName) {
            Object.values(views).forEach(v => v.classList.add('hidden-view'));
            views[viewName].classList.remove('hidden-view');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-message').textContent = message;
            
            if (isError) {
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
                icon.classList.replace('text-green-400', 'text-red-400');
            } else {
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
                icon.classList.replace('text-red-400', 'text-green-400');
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // --- ROUTER ---
        async function init() {
            // Update UI status badge
            if (isVercelMode) {
                const badge = document.getElementById('db-status');
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Vercel KV Active`;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const shortCode = urlParams.get('l'); 

            if (shortCode) {
                showView('redirect');
                await handleRedirection(shortCode);
            } else {
                if (sessionStorage.getItem('auth') === 'true') {
                    showView('dashboard');
                    loadDashboard();
                } else {
                    showView('login');
                }
            }
        }

        // --- REDIRECTION ENGINE ---
        async function handleRedirection(shortCode) {
            const title = document.getElementById('redirect-title');
            const msg = document.getElementById('redirect-msg');
            const spinner = document.getElementById('redirect-spinner');
            const btn = document.getElementById('redirect-btn');

            const key = `link_${shortCode}`;
            const linkData = await DB.get(key);

            if (!linkData) {
                spinner.style.display = 'none';
                title.textContent = "Link Not Found";
                title.classList.replace('text-white', 'text-red-400');
                msg.textContent = "This link doesn't exist or was closed by the creator.";
                return;
            }

            // Check Expiration
            const now = Date.now();
            if (linkData.expiresAt && now > linkData.expiresAt) {
                spinner.style.display = 'none';
                title.textContent = "Link Expired";
                title.classList.replace('text-white', 'text-yellow-400');
                msg.textContent = "The time limit on this transfer has ran out.";
                
                // Auto-cleanup expired links to save database space
                await DB.delete(key);
                return;
            }

            // Success! Transfer user.
            title.textContent = "Transferring...";
            title.classList.replace('text-white', 'text-blue-400');
            msg.textContent = `Connecting you to ${new URL(linkData.target).hostname}`;
            
            // Set up fallback button in case auto-redirect is blocked by browser
            btn.classList.remove('hidden');
            btn.onclick = () => window.location.href = linkData.target;

            // Execute redirect
            setTimeout(() => {
                window.location.replace(linkData.target);
            }, 800);
        }

        // --- ADMIN LOGIN ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('password-input').value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('auth', 'true');
                showView('dashboard');
                loadDashboard();
                document.getElementById('password-input').value = '';
            } else {
                showToast("Incorrect password.", true);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            sessionStorage.removeItem('auth');
            showView('login');
        });

        // --- DASHBOARD: RENDER LINKS ---
        async function loadDashboard() {
            const container = document.getElementById('links-container');
            const count = document.getElementById('link-count');
            
            container.innerHTML = `<div class="text-center text-gray-500 py-10 animate-pulse">Loading transfers...</div>`;
            
            const allLinks = await DB.getAll();
            const entries = Object.entries(allLinks).sort((a, b) => b[1].createdAt - a[1].createdAt);
            
            count.textContent = `${entries.length} Links`;
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full py-16 text-gray-500 text-sm">
                        <svg class="w-12 h-12 mb-3 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        No active transfers. Create your first link!
                    </div>`;
                return;
            }

            const now = Date.now();

            entries.forEach(([key, data]) => {
                const shortCode = key.replace('link_', '');
                const baseUrl = window.location.origin + window.location.pathname;
                const shareUrl = `${baseUrl}?l=${shortCode}`;
                
                const isExpired = data.expiresAt && now > data.expiresAt;
                
                let timeText = "Valid for Lifetime";
                if (data.expiresAt) {
                    const d = new Date(data.expiresAt);
                    timeText = `Expires: ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                }

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border ${isExpired ? 'bg-gray-800/50 border-gray-700/50 opacity-60' : 'bg-gray-900 border-gray-700'} flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all`;
                
                card.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-3 mb-1">
                            <span class="text-blue-400 font-mono font-bold tracking-wider">/${shortCode}</span>
                            ${isExpired ? '<span class="text-[10px] uppercase font-bold tracking-wider text-yellow-500 bg-yellow-500/10 px-2 py-0.5 rounded">Expired</span>' : '<span class="text-[10px] uppercase font-bold tracking-wider text-green-400 bg-green-400/10 px-2 py-0.5 rounded">Active</span>'}
                        </div>
                        <a href="${data.target}" target="_blank" class="text-sm text-gray-300 hover:text-white truncate block w-full mb-2" title="${data.target}">${data.target}</a>
                        <div class="text-xs text-gray-500 font-medium">${timeText}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="copyToClip('${shareUrl}')" class="p-2.5 bg-gray-800 hover:bg-blue-600 text-gray-300 hover:text-white rounded-xl transition-colors border border-gray-700 shadow-sm" title="Copy Link">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </button>
                        <button onclick="deleteLink('${key}')" class="p-2.5 bg-gray-800 hover:bg-red-500 hover:border-red-500 text-gray-300 hover:text-white rounded-xl transition-colors border border-gray-700 shadow-sm" title="Close/Delete Link">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- DASHBOARD: CREATE LINK ---
        document.getElementById('create-link-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-generate');
            const targetUrl = document.getElementById('target-url').value;
            const expSelection = document.getElementById('expiration-select').value;
            
            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin mx-auto"></div>`;
            btn.disabled = true;

            try {
                // Generate short string (5 chars)
                const shortCode = Math.random().toString(36).substring(2, 7);
                const key = `link_${shortCode}`;
                
                let expiresAt = null;
                const now = Date.now();
                if (expSelection === '1m') expiresAt = now + (60 * 1000);
                if (expSelection === '1h') expiresAt = now + (60 * 60 * 1000);
                if (expSelection === '24h') expiresAt = now + (24 * 60 * 60 * 1000);
                if (expSelection === '7d') expiresAt = now + (7 * 24 * 60 * 60 * 1000);

                await DB.save(key, { target: targetUrl, createdAt: now, expiresAt });
                
                document.getElementById('target-url').value = '';
                showToast(`Transfer link generated!`);
                loadDashboard();
            } catch (err) {
                console.error(err);
                showToast("Error creating link.", true);
            } finally {
                btn.innerHTML = "Generate Short Link";
                btn.disabled = false;
            }
        });

        // --- UTILS ---
        window.deleteLink = async (key) => {
            await DB.delete(key);
            showToast("Transfer link closed.");
            loadDashboard();
        };

        window.copyToClip = (text) => {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast("Link copied to clipboard!"));
            } else {
                // Fallback
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast("Link copied!");
                } catch (err) {
                    showToast("Failed to copy.", true);
                }
                document.body.removeChild(textArea);
            }
        };

        // Start
        init();
    </script>
</body>
</html>
